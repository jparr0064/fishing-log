# CR-3: scheduled dependency update proposals.
#
# Dependabot opens PRs; CI (.github/workflows/ci.yml) runs the suite and the
# vulnerability audit against each one. Nothing merges itself — review the
# Streamlit ones especially, since this app pins Streamlit deliberately and an
# upgrade needs the manual UI pass described in CLAUDE.md.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One PR for routine transitive bumps; anything below gets its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - streamlit
          - Authlib
    ignore:
      # Authlib 1.6.6 breaks the streamlit OIDC callback (streamlit#13461).
      # Unpin deliberately and test the Google sign-in path by hand — there is
      # no automated coverage of /oauth2callback.
      - dependency-name: Authlib
        versions: ["1.6.6"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
