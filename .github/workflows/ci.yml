name: CI

# CR-3 / CR-6: run the suite and a dependency vulnerability scan on every push
# and pull request, so a regression or a newly-disclosed CVE surfaces before it
# reaches the club's deployment rather than after.

on:
  push:
    # cloud-version is the deploy branch — pushing to it IS deploying, so it is
    # the branch that most needs the suite to run. It was missing here until
    # 2026-08-30, which meant CI had never actually run: GitHub only reads a
    # workflow file from the branch being pushed, so a push to cloud-version
    # found this file saying "main only" and skipped, while a push to main
    # found no file at all.
    branches: [main, cloud-version]
  pull_request:
  # Lets the audit catch CVEs disclosed after the last commit.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the deployed runtime; see CLAUDE.md.
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        # The lock file, not requirements.txt — CI should fail when the pinned
        # set breaks, not silently test against whatever resolved today.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Compile-check the app
        # app.py has no unit coverage; this at least catches syntax errors.
        run: python -m py_compile app.py

  audit:
    runs-on: ubuntu-latest
    # Report vulnerabilities even when tests fail — the two are independent.
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit locked dependencies
        # Fails the job on any known vulnerability in the pinned set. If a
        # finding has no fix available yet, add `--ignore-vuln <ID>` with a
        # comment naming the advisory and the reason, rather than deleting
        # this step.
        run: python -m pip_audit --requirement requirements.lock.txt --strict
