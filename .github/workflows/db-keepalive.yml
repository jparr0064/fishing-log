name: Keep Supabase awake

# Supabase pauses free-tier projects after about 7 days with no database
# activity. This runs a trivial query against both projects every day so
# neither one ever gets close to that window.
#
# IMPORTANT: this file must live on the repo's DEFAULT branch
# (cloud-version) or GitHub will never fire the schedule.

on:
  schedule:
    # 07:00 UTC = 3:00 AM Eastern, every day
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL_PROD is not set in repository secrets."
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'production alive at ' || now();"

      - name: Ping sandbox database
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL_SANDBOX is not set in repository secrets."
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'sandbox alive at ' || now();"
