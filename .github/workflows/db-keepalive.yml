name: Keep Supabase awake

# Supabase pauses free-tier projects after about 7 days with no database
# activity. This runs a trivial query against both projects every day so
# neither one ever gets close to that window.
#
# The psql pings ran green every day from 2026-09-14, yet on 2026-09-24
# Supabase emailed that the sandbox had had no activity for 7 days. The cause:
# SUPABASE_DB_URL_SANDBOX held production's connection string, so both pings
# hit prod. The last step now fails if a DB URL secret names the wrong project.
# Each project also gets an API-gateway ping, in case Supabase's activity
# check doesn't count direct Postgres connections. Secrets per project:
# (SUPABASE_DB_URL_* and SUPABASE_URL_* differ only by "DB_" and sit next to
# each other in GitHub's list; a paste into the wrong one is easy to make.)
#   SUPABASE_DB_URL_<PROD|SANDBOX>    postgresql:// string (session/transaction
#                                     pooler; runners have no IPv6)
#   SUPABASE_URL_<PROD|SANDBOX>       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY_<PROD|SANDBOX>  the anon / publishable key
#
# What Supabase counts (learned the hard way): a bare `select now()` and the
# /auth/v1/health check did NOT keep a project awake. The sandbox was warned on
# 2026-10-10 with both passing daily; after it switched to a table read plus a
# PostgREST request it went a week with no warning, while prod, still on the
# old pings, was warned on 2026-10-16 even though the app had been used. The
# app talks straight to Postgres, never through Supabase's API, so real use may
# not register either. Both projects now get the table read + REST request.
#
# IMPORTANT: this file must live on the repo's DEFAULT branch
# (cloud-version) or GitHub will never fire the schedule.

on:
  schedule:
    # Twice a day, 07:00 and 19:00 UTC (3 AM / 3 PM Eastern). Supabase asks for
    # "a few requests each day"; GitHub sometimes delays or drops a scheduled
    # run, so one a day leaves no margin.
    - cron: "0 7,19 * * *"
  workflow_dispatch:
  # Run once whenever this file changes, so an edit is proven on the spot
  # instead of at 3 AM.
  push:
    branches: [cloud-version]
    paths: [.github/workflows/db-keepalive.yml]

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # The sandbox's project ref. Not a secret: it is in the project's public
      # URL. On 2026-10-10 Supabase warned this project was idle even though
      # every run since 2026-09-26 passed, and the old check only proved the two
      # sandbox secrets agreed with each other, not that they named this project.
      SANDBOX_REF: vgzmzlwzbaqurayucmdg
      # Production's ref, pinned the same way. SUPABASE_URL_PROD still names a
      # dead project, so nothing below relies on it.
      PROD_REF: dzeymlmnhocsucvplzna
    steps:
      - name: Check the production DB secret names the production project
        env:
          DB_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          got=$(printf '%s' "$DB_PROD" | grep -oE '([a-z0-9]{20})\.supabase\.co|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | head -n1 || true)
          if [ "$got" = "$PROD_REF" ]; then
            echo "SUPABASE_DB_URL_PROD names $PROD_REF: yes"
          else
            echo "::error::SUPABASE_DB_URL_PROD does not name the production project $PROD_REF (ref found: $([ -n "$got" ] && echo yes || echo no)). Re-paste it from .streamlit/secrets.toml."
            exit 1
          fi

      - name: Check the sandbox secrets name the sandbox project
        if: always()
        env:
          DB_SANDBOX: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          URL_SANDBOX: ${{ secrets.SUPABASE_URL_SANDBOX }}
        run: |
          # Handles https://<ref>.supabase.co, the direct db.<ref>.supabase.co
          # host, and the pooler's postgres.<ref> user. Only the expected ref
          # (already public above) and yes/no are ever printed.
          ref() {
            printf '%s' "$1" | grep -oE '([a-z0-9]{20})\.supabase\.co|/project/[a-z0-9]{20}|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | head -n1 || true
          }
          ok=yes
          for name in SUPABASE_DB_URL_SANDBOX SUPABASE_URL_SANDBOX; do
            case $name in
              SUPABASE_DB_URL_SANDBOX) got=$(ref "$DB_SANDBOX") ;;
              *)                       got=$(ref "$URL_SANDBOX") ;;
            esac
            if [ "$got" = "$SANDBOX_REF" ]; then
              echo "$name names $SANDBOX_REF: yes"
            else
              echo "::error::$name does not name the sandbox project $SANDBOX_REF (ref found: $([ -n "$got" ] && echo yes || echo no)). Re-paste it from .streamlit/secrets.sandbox.toml."
              ok=no
            fi
          done
          [ "$ok" = yes ]

      - name: Ping production database
        if: always()
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_PROD has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_PROD: $scheme"
          else
            echo "SUPABASE_DB_URL_PROD does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          # Read a real table, not just now() (see the note at the top).
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'production alive at ' || now() || ', sessions rows visible: ' || (select count(*) from (select id from public.sessions limit 1) s);"

      - name: Ping sandbox database
        if: always()
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_SANDBOX has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_SANDBOX: $scheme"
          else
            echo "SUPABASE_DB_URL_SANDBOX does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          # Read a real table, not just now(), in case a bare query doesn't
          # register as activity. RLS may hide every row; the read still runs.
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'sandbox alive at ' || now() || ', sessions rows visible: ' || (select count(*) from (select id from public.sessions limit 1) s);"

      - name: Ping production API (REST read of a real table)
        if: always()
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          set -uo pipefail
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY_PROD is not set."
            exit 1
          fi
          # Same request as the sandbox step below, which is what stopped the
          # sandbox's idle warnings: a PostgREST read on the pinned ref (so the
          # dead SUPABASE_URL_PROD no longer matters). Only the apikey header.
          # anon has no table rights (migrations/001), so the expected answer is
          # HTTP 401 with Postgres code 42501: the query reached the database.
          # A 2xx passes too; a 401 without 42501 means the key was rejected.
          resp=$(mktemp)
          rc=0
          code=$(curl -sS -o "$resp" -w '%{http_code}' --max-time 60 \
                   -H "apikey: $ANON_KEY" \
                   "https://$PROD_REF.supabase.co/rest/v1/sessions?select=id&limit=1") || rc=$?  # -w prints 000 on failure
          echo "Production REST read of sessions: HTTP $code"
          case "$code" in
            2*) exit 0 ;;
            401|403)
              if grep -q '"42501"' "$resp"; then
                echo "Postgres refused the anon role (42501), so the query reached the production database."
                exit 0
              fi
              ;;
          esac
          # Supabase's error bodies name the problem and never echo the key.
          echo "::error::Production REST ping failed: HTTP $code (curl exit $rc): $(head -c 200 "$resp" | tr -d '\r\n')"
          exit 1

      - name: Ping sandbox API (REST read of a real table)
        if: always()
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_SANDBOX }}
        run: |
          set -uo pipefail
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY_SANDBOX is not set."
            exit 1
          fi
          # Goes straight to the pinned sandbox ref: the first step already
          # fails the run if the URL secrets name anything else.
          # A table read through PostgREST, rather than /auth/v1/health, in case
          # Supabase doesn't count the auth health check as activity. Only the
          # apikey header: newer publishable keys are rejected as a Bearer token.
          # migrations/001 revokes all table rights from anon, so the expected
          # answer is HTTP 401 with Postgres code 42501 (permission denied).
          # Postgres has to receive the query to refuse it, so that counts as
          # reaching the database. A 2xx (if anon is ever granted SELECT) passes
          # too. A 401 without 42501 means the key itself was rejected.
          resp=$(mktemp)
          rc=0
          code=$(curl -sS -o "$resp" -w '%{http_code}' --max-time 60 \
                   -H "apikey: $ANON_KEY" \
                   "https://$SANDBOX_REF.supabase.co/rest/v1/sessions?select=id&limit=1") || rc=$?  # -w prints 000 on failure
          echo "Sandbox REST read of sessions: HTTP $code"
          case "$code" in
            2*) exit 0 ;;
            401|403)
              if grep -q '"42501"' "$resp"; then
                echo "Postgres refused the anon role (42501), so the query reached the sandbox database."
                exit 0
              fi
              ;;
          esac
          # Supabase's error bodies name the problem and never echo the key.
          echo "::error::Sandbox REST ping failed: HTTP $code (curl exit $rc): $(head -c 200 "$resp" | tr -d '\r\n')"
          exit 1

      - name: Check the secrets point at the projects they're named for
        # The sandbox psql ping passed daily while Supabase still called the
        # sandbox idle: SUPABASE_DB_URL_SANDBOX named a different project.
        # Compare the project refs inside each secret; print only match/no-match.
        if: always()
        env:
          DB_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          DB_SANDBOX: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          URL_SANDBOX: ${{ secrets.SUPABASE_URL_SANDBOX }}
        run: |
          ref() {
            printf '%s' "$1" | grep -oE '([a-z0-9]{20})\.supabase\.co|/project/[a-z0-9]{20}|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | head -n1 || true
          }
          yn() { [ -n "$1" ] && echo y || echo n; }
          same() { [ -n "$1" ] && [ "$1" = "$2" ] && echo yes || echo no; }
          dp=$(ref "$DB_PROD"); ds=$(ref "$DB_SANDBOX"); up=$(ref "$URL_PROD"); us=$(ref "$URL_SANDBOX")
          echo "::notice::DB_URL_SANDBOX same project as URL_SANDBOX: $(same "$ds" "$us") | DB_URL_SANDBOX same as DB_URL_PROD: $(same "$ds" "$dp") | DB_URL_PROD same as URL_PROD: $(same "$dp" "$up") | refs found (dbP dbS urlP urlS): $(yn "$dp") $(yn "$ds") $(yn "$up") $(yn "$us")"
          # The sandbox refs are enforced by the first step; this one only
          # reports, mainly so a still-wrong SUPABASE_URL_PROD stays visible.
          [ "$(same "$dp" "$up")" = yes ] || echo "::warning::SUPABASE_URL_PROD and SUPABASE_DB_URL_PROD name different projects; SUPABASE_URL_PROD probably still holds the dead project's URL."
