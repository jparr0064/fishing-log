name: Keep Supabase awake

# Supabase pauses free-tier projects after about 7 days with no database
# activity. This runs a trivial query against both projects every day so
# neither one ever gets close to that window.
#
# The psql query alone was NOT enough: it ran green every day from 2026-09-14,
# and on 2026-09-24 Supabase still emailed that the sandbox had had no
# "sufficient activity" for 7 days. Supabase appears to count requests through
# its API gateway, not direct Postgres connections, so each project also gets
# a REST API call below. Those steps need two secrets per project:
#   SUPABASE_URL_<PROD|SANDBOX>       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY_<PROD|SANDBOX>  the anon (public) key, Settings > API
#
# IMPORTANT: this file must live on the repo's DEFAULT branch
# (cloud-version) or GitHub will never fire the schedule.

on:
  schedule:
    # 07:00 UTC = 3:00 AM Eastern, every day
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production database
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_PROD has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_PROD: $scheme"
          else
            echo "SUPABASE_DB_URL_PROD does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'production alive at ' || now();"

      - name: Ping sandbox database
        if: always()
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_SANDBOX has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_SANDBOX: $scheme"
          else
            echo "SUPABASE_DB_URL_SANDBOX does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'sandbox alive at ' || now();"

      - name: Ping production REST API
        if: always()
        env:
          API_URL: ${{ secrets.SUPABASE_URL_PROD }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_URL_PROD or SUPABASE_ANON_KEY_PROD is not set."
            exit 1
          fi
          # The REST root answers with the schema description; any 2xx means
          # the request went through Supabase's API gateway, which is the point.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
                   -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
                   "${API_URL%/}/rest/v1/" || echo "000")
          echo "Production REST API: HTTP $code"
          case "$code" in 2*) ;; *) exit 1 ;; esac

      - name: Ping sandbox REST API
        if: always()
        env:
          API_URL: ${{ secrets.SUPABASE_URL_SANDBOX }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_SANDBOX }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_URL_SANDBOX or SUPABASE_ANON_KEY_SANDBOX is not set."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
                   -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
                   "${API_URL%/}/rest/v1/" || echo "000")
          echo "Sandbox REST API: HTTP $code"
          case "$code" in 2*) ;; *) exit 1 ;; esac
