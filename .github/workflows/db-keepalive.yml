name: Keep Supabase awake

# Supabase pauses free-tier projects after about 7 days with no database
# activity. This runs a trivial query against both projects every day so
# neither one ever gets close to that window.
#
# IMPORTANT: this file must live on the repo's DEFAULT branch
# (cloud-version) or GitHub will never fire the schedule.

on:
  schedule:
    # 07:00 UTC = 3:00 AM Eastern, every day
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production database
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -uo pipefail
          # Tolerate a connection string pasted with surrounding quotes,
          # stray whitespace, or the "database_url = " prefix still attached.
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *postgresql://*) url="postgresql://${url#*postgresql://}" ;;
            *postgres://*)   url="postgres://${url#*postgres://}" ;;
            *)
              echo "SUPABASE_DB_URL_PROD does not contain a postgresql:// connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          url=$(printf '%s' "$url" | sed 's/[[:space:]]*$//')
          url="${url%\"}"
          url="${url%\'}"
          psql "$url" -v ON_ERROR_STOP=1 -At -c "select 'production alive at ' || now();"

      - name: Ping sandbox database
        if: always()
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *postgresql://*) url="postgresql://${url#*postgresql://}" ;;
            *postgres://*)   url="postgres://${url#*postgres://}" ;;
            *)
              echo "SUPABASE_DB_URL_SANDBOX does not contain a postgresql:// connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          url=$(printf '%s' "$url" | sed 's/[[:space:]]*$//')
          url="${url%\"}"
          url="${url%\'}"
          psql "$url" -v ON_ERROR_STOP=1 -At -c "select 'sandbox alive at ' || now();"
