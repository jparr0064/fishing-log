name: Keep Supabase awake

# Supabase pauses free-tier projects after about 7 days with no database
# activity. This runs a trivial query against both projects every day so
# neither one ever gets close to that window.
#
# The psql pings ran green every day from 2026-09-14, yet on 2026-09-24
# Supabase emailed that the sandbox had had no activity for 7 days. The cause:
# SUPABASE_DB_URL_SANDBOX held production's connection string, so both pings
# hit prod. The last step now fails if a DB URL secret names the wrong project.
# Each project also gets an API-gateway ping, in case Supabase's activity
# check doesn't count direct Postgres connections. Secrets per project:
#   SUPABASE_DB_URL_<PROD|SANDBOX>    postgresql:// string (session/transaction
#                                     pooler; runners have no IPv6)
#   SUPABASE_URL_<PROD|SANDBOX>       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY_<PROD|SANDBOX>  the anon / publishable key
#
# IMPORTANT: this file must live on the repo's DEFAULT branch
# (cloud-version) or GitHub will never fire the schedule.

on:
  schedule:
    # 07:00 UTC = 3:00 AM Eastern, every day
    - cron: "0 7 * * *"
  workflow_dispatch:
  # Run once whenever this file changes, so an edit is proven on the spot
  # instead of at 3 AM.
  push:
    branches: [cloud-version]
    paths: [.github/workflows/db-keepalive.yml]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production database
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_PROD has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_PROD: $scheme"
          else
            echo "SUPABASE_DB_URL_PROD does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'production alive at ' || now();"

      - name: Ping sandbox database
        if: always()
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -uo pipefail
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n')
          case "$url" in
            *://*) ;;
            *)
              echo "SUPABASE_DB_URL_SANDBOX has no :// in it, so it is not a connection string."
              echo "Characters stored in the secret: ${#url}"
              exit 1
              ;;
          esac
          scheme=${url%%://*}
          rest=${url#*://}
          # Only ever print the scheme, and only when it is a plain scheme name.
          # This log is public, so nothing after the :// is ever echoed.
          if printf '%s' "$scheme" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]{0,19}$'; then
            echo "Scheme found in SUPABASE_DB_URL_SANDBOX: $scheme"
          else
            echo "SUPABASE_DB_URL_SANDBOX does not start with a plain URL scheme."
            echo "Characters stored in the secret: ${#url}"
            exit 1
          fi
          rest=$(printf '%s' "$rest" | sed 's/[[:space:]]*$//')
          rest="${rest%\"}"
          rest="${rest%\'}"
          psql "postgresql://$rest" -v ON_ERROR_STOP=1 -At -c "select 'sandbox alive at ' || now();"

      - name: Ping production API gateway
        if: always()
        env:
          API_URL: ${{ secrets.SUPABASE_URL_PROD }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_URL_PROD or SUPABASE_ANON_KEY_PROD is not set."
            exit 1
          fi
          # Only the apikey header: Supabase's newer publishable keys are not
          # JWTs and are rejected when also sent as a Bearer token. The auth
          # health endpoint accepts any valid project key, while the REST root
          # (/rest/v1/) now refuses the anon key.
          # Try every project ref found in the URL and DB URL secrets (the
          # project URL, a postgresql:// string with db.<ref>.supabase.co or the
          # pooler's postgres.<ref> user, or a dashboard link) and succeed on the
          # first one the key belongs to. On 2026-09-26 each secret pair had one
          # wrong entry — SUPABASE_URL_PROD named a dead project and
          # SUPABASE_DB_URL_SANDBOX held prod's string — so trusting either
          # alone failed one project or the other.
          refs=$(printf '%s\n%s\n' "$API_URL" "$DB_URL" | grep -oE '([a-z0-9]{20})\.supabase\.co|/project/[a-z0-9]{20}|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | awk '!seen[$0]++' || true)
          if [ -z "$refs" ]; then
            # Describe the value's shape without printing it: this log is public.
            echo "::error::No Supabase project ref found in the URL secret (${#API_URL} characters, starts with '$(printf '%s' "$API_URL" | head -c 8 | tr -cd 'A-Za-z:/.')'). It should be https://<project-ref>.supabase.co."
            exit 1
          fi
          resp=$(mktemp)
          n=0
          for ref in $refs; do
            n=$((n + 1))
            # GitHub runs this under bash -e, so catch curl's failure here or a
            # dead first candidate ends the step before the next one is tried.
            rc=0
            code=$(curl -sS -o "$resp" -w '%{http_code}' --max-time 60 \
                     -H "apikey: $ANON_KEY" \
                     "https://$ref.supabase.co/auth/v1/health") || rc=$?  # -w prints 000 on failure
            echo "Production API gateway, candidate $n: HTTP $code"
            case "$code" in 2*) exit 0 ;; esac
          done
          # Supabase's error bodies name the problem and never echo the key.
          echo "::error::Production API ping failed for all $n candidate project(s); last got HTTP $code (curl exit $rc): $(head -c 200 "$resp" | tr -d '\r\n')"
          exit 1

      - name: Ping sandbox API gateway
        if: always()
        env:
          API_URL: ${{ secrets.SUPABASE_URL_SANDBOX }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_SANDBOX }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_URL_SANDBOX or SUPABASE_ANON_KEY_SANDBOX is not set."
            exit 1
          fi
          # Only the apikey header: Supabase's newer publishable keys are not
          # JWTs and are rejected when also sent as a Bearer token. The auth
          # health endpoint accepts any valid project key, while the REST root
          # (/rest/v1/) now refuses the anon key.
          # Try every project ref found in the URL and DB URL secrets (the
          # project URL, a postgresql:// string with db.<ref>.supabase.co or the
          # pooler's postgres.<ref> user, or a dashboard link) and succeed on the
          # first one the key belongs to. On 2026-09-26 each secret pair had one
          # wrong entry — SUPABASE_URL_PROD named a dead project and
          # SUPABASE_DB_URL_SANDBOX held prod's string — so trusting either
          # alone failed one project or the other.
          refs=$(printf '%s\n%s\n' "$API_URL" "$DB_URL" | grep -oE '([a-z0-9]{20})\.supabase\.co|/project/[a-z0-9]{20}|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | awk '!seen[$0]++' || true)
          if [ -z "$refs" ]; then
            # Describe the value's shape without printing it: this log is public.
            echo "::error::No Supabase project ref found in the URL secret (${#API_URL} characters, starts with '$(printf '%s' "$API_URL" | head -c 8 | tr -cd 'A-Za-z:/.')'). It should be https://<project-ref>.supabase.co."
            exit 1
          fi
          resp=$(mktemp)
          n=0
          for ref in $refs; do
            n=$((n + 1))
            # GitHub runs this under bash -e, so catch curl's failure here or a
            # dead first candidate ends the step before the next one is tried.
            rc=0
            code=$(curl -sS -o "$resp" -w '%{http_code}' --max-time 60 \
                     -H "apikey: $ANON_KEY" \
                     "https://$ref.supabase.co/auth/v1/health") || rc=$?  # -w prints 000 on failure
            echo "Sandbox API gateway, candidate $n: HTTP $code"
            case "$code" in 2*) exit 0 ;; esac
          done
          # Supabase's error bodies name the problem and never echo the key.
          echo "::error::Sandbox API ping failed for all $n candidate project(s); last got HTTP $code (curl exit $rc): $(head -c 200 "$resp" | tr -d '\r\n')"
          exit 1

      - name: Check the secrets point at the projects they're named for
        # The sandbox psql ping passed daily while Supabase still called the
        # sandbox idle: SUPABASE_DB_URL_SANDBOX named a different project.
        # Compare the project refs inside each secret; print only match/no-match.
        if: always()
        env:
          DB_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          DB_SANDBOX: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          URL_SANDBOX: ${{ secrets.SUPABASE_URL_SANDBOX }}
        run: |
          ref() {
            printf '%s' "$1" | grep -oE '([a-z0-9]{20})\.supabase\.co|/project/[a-z0-9]{20}|postgres\.[a-z0-9]{20}[:@]' | grep -oE '[a-z0-9]{20}' | head -n1 || true
          }
          yn() { [ -n "$1" ] && echo y || echo n; }
          same() { [ -n "$1" ] && [ "$1" = "$2" ] && echo yes || echo no; }
          dp=$(ref "$DB_PROD"); ds=$(ref "$DB_SANDBOX"); up=$(ref "$URL_PROD"); us=$(ref "$URL_SANDBOX")
          echo "::notice::DB_URL_SANDBOX same project as URL_SANDBOX: $(same "$ds" "$us") | DB_URL_SANDBOX same as DB_URL_PROD: $(same "$ds" "$dp") | DB_URL_PROD same as URL_PROD: $(same "$dp" "$up") | refs found (dbP dbS urlP urlS): $(yn "$dp") $(yn "$ds") $(yn "$up") $(yn "$us")"
          # A warning, not a failure: the sandbox API-gateway ping still reaches
          # the right project, so a wrong DB URL here is worth fixing but not
          # worth a daily "Run failed" email.
          [ "$(same "$ds" "$us")" = yes ] || echo "::warning::SUPABASE_DB_URL_SANDBOX does not point at the sandbox project; the sandbox psql ping is hitting another database."
